<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Copiloto de Rotas</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b1220;
      color: white;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 16px;
    }

    h1 {
      margin: 0 0 5px;
      font-size: 34px;
    }

    .status {
      color: #4ade80;
      font-size: 18px;
      margin-bottom: 18px;
    }

    input,
    button {
      width: 100%;
      border-radius: 14px;
      padding: 16px;
      font-size: 18px;
      margin-top: 10px;
    }

    input {
      background: #182337;
      color: white;
      border: 2px solid #334155;
    }

    button {
      border: none;
      background: #2563eb;
      color: white;
      font-weight: bold;
    }

    .card {
      background: #162236;
      border-radius: 18px;
      padding: 18px;
      margin-top: 16px;
    }

    .resultado {
      background: #111c2e;
      border-radius: 16px;
      padding: 16px;
      margin-top: 12px;
    }

    .resultado strong {
      display: block;
      font-size: 18px;
      margin-bottom: 8px;
    }

    .distancia {
      color: #aab7ca;
      margin-bottom: 8px;
    }

    #map {
      height: 430px;
      margin-top: 16px;
      border-radius: 18px;
      overflow: hidden;
      display: none;
    }

    .rota {
      background: #111c2e;
      border-radius: 16px;
      padding: 18px;
      margin-top: 12px;
      border: 1px solid #24344d;
    }

    .rota.melhor {
      border: 2px solid #4ade80;
    }

    .melhor-texto {
      color: #4ade80;
      font-weight: bold;
      margin-top: 12px;
    }

    .alternativa {
      color: #60a5fa;
      font-weight: bold;
    }

    .mensagem {
      background: #162236;
      border-radius: 16px;
      padding: 18px;
      margin-top: 16px;
      color: #cbd5e1;
    }

    .escondido {
      display: none;
    }

    .pequeno {
      color: #94a3b8;
      font-size: 14px;
      margin-top: 8px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🛵 Copiloto de Rotas</h1>

  <div class="status" id="status">
    ● GPS aguardando
  </div>

  <input
    id="destino"
    type="text"
    placeholder="Digite o destino"
    autocomplete="off"
  >

  <button onclick="pesquisarDestino()">
    📍 Procurar destino
  </button>

  <button onclick="ativarGPS()">
    📍 Ativar localização
  </button>

  <div id="resultados" class="card escondido"></div>

  <div id="map"></div>

  <div id="rotas"></div>

  <div id="mensagem" class="mensagem">
    Digite um destino para começar.
  </div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

let minhaLocalizacao = null;
let destinoSelecionado = null;
let mapa = null;
let marcadores = [];
let linhasRota = [];

/* Limite de pesquisa do Amapá */
const AMAPA = {
  sul: -1.5,
  oeste: -55.0,
  norte: 4.8,
  leste: -49.5
};

/* GPS */
function ativarGPS() {

  const status = document.getElementById("status");

  if (!navigator.geolocation) {
    status.innerText = "● GPS não disponível";
    return;
  }

  status.innerText = "● Localizando...";

  navigator.geolocation.getCurrentPosition(

    function(posicao) {

      minhaLocalizacao = {
        lat: posicao.coords.latitude,
        lon: posicao.coords.longitude
      };

      status.innerText = "● GPS ativo";

      document.getElementById("mensagem").innerText =
        "Localização encontrada. Escolha um destino.";

      mostrarMapaInicial();
    },

    function() {

      status.innerText =
        "● Permissão de localização negada";

    },

    {
      enableHighAccuracy: true,
      timeout: 15000,
      maximumAge: 30000
    }
  );
}

/* PESQUISA INTELIGENTE */
async function pesquisarDestino() {

  const texto =
    document.getElementById("destino").value.trim();

  const resultados =
    document.getElementById("resultados");

  const mensagem =
    document.getElementById("mensagem");

  if (!texto) {
    mensagem.innerText =
      "Digite um destino para pesquisar.";
    return;
  }

  resultados.classList.remove("escondido");

  resultados.innerHTML =
    "<strong>🔎 Procurando no Amapá...</strong>";

  try {

    const consultas = [
      texto,
      texto + ", Amapá",
      texto + ", Santana, Amapá",
      texto + ", Macapá, Amapá"
    ];

    let encontrados = [];

    for (const consulta of consultas) {

      const url =
        "https://nominatim.openstreetmap.org/search" +
        "?format=json" +
        "&addressdetails=1" +
        "&limit=10" +
        "&countrycodes=br" +
        "&bounded=1" +
        "&viewbox=-55,4.8,-49.5,-1.5" +
        "&q=" +
        encodeURIComponent(consulta);

      const resposta = await fetch(url, {
        headers: {
          "Accept": "application/json"
        }
      });

      if (!resposta.ok) continue;

      const dados = await resposta.json();

      encontrados.push(...dados);

      if (dados.length > 0) break;
    }

    /* Filtra somente Amapá */
    const filtrados = encontrados.filter(item => {

      const estado =
        (item.address?.state || "").toLowerCase();

      const display =
        (item.display_name || "").toLowerCase();

      return (
        estado.includes("amapá") ||
        estado.includes("amapa") ||
        display.includes("amapá") ||
        display.includes("amapa")
      );
    });

    /* Remove duplicados */
    const unicos = [];

    filtrados.forEach(item => {

      const chave =
        item.lat + "," + item.lon;

      if (
        !unicos.some(
          outro =>
            outro.lat + "," + outro.lon === chave
        )
      ) {
        unicos.push(item);
      }
    });

    if (unicos.length === 0) {

      resultados.innerHTML =
        "<strong>❌ Nenhum local encontrado no Amapá.</strong>" +
        "<div class='pequeno'>" +
        "Tente somente o nome do estabelecimento, rua ou bairro." +
        "</div>";

      return;
    }

    resultados.innerHTML =
      "<strong>📍 Destinos encontrados no Amapá</strong>" +
      "<div class='pequeno'>" +
      "Escolha o local correto:" +
      "</div>";

    unicos.slice(0, 8).forEach((item, indice) => {

      const div =
        document.createElement("div");

      div.className = "resultado";

      let distanciaTexto = "";

      if (minhaLocalizacao) {

        const distancia =
          calcularDistancia(
            minhaLocalizacao.lat,
            minhaLocalizacao.lon,
            parseFloat(item.lat),
            parseFloat(item.lon)
          );

        distanciaTexto =
          formatarDistancia(distancia) +
          " da sua localização";
      }

      div.innerHTML = `
        <strong>
          ${indice + 1}. ${escaparHTML(item.display_name)}
        </strong>

        <div class="distancia">
          ${distanciaTexto}
        </div>

        <button>
          Usar este destino
        </button>
      `;

      div.querySelector("button").onclick =
        function() {
          selecionarDestino(item);
        };

      resultados.appendChild(div);
    });

  } catch (erro) {

    resultados.innerHTML =
      "<strong>❌ Erro na pesquisa.</strong>" +
      "<div class='pequeno'>" +
      "Verifique sua conexão e tente novamente." +
      "</div>";
  }
}

/* SELECIONAR DESTINO */
function selecionarDestino(item) {

  destinoSelecionado = {
    lat: parseFloat(item.lat),
    lon: parseFloat(item.lon),
    nome: item.display_name
  };

  document.getElementById("destino").value =
    item.display_name;

  document.getElementById("resultados")
    .classList.add("escondido");

  if (!minhaLocalizacao) {

    document.getElementById("mensagem").innerText =
      "Destino selecionado. Ative sua localização.";

    ativarGPS();

    return;
  }

  calcularRotas();
}

/* MAPA */
function criarMapa() {

  const elemento =
    document.getElementById("map");

  elemento.style.display = "block";

  if (mapa) return;

  mapa = L.map("map");

  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      maxZoom: 19,
      attribution:
        "&copy; OpenStreetMap contributors"
    }
  ).addTo(mapa);
}

function mostrarMapaInicial() {

  if (!minhaLocalizacao) return;

  criarMapa();

  mapa.setView(
    [
      minhaLocalizacao.lat,
      minhaLocalizacao.lon
    ],
    13
  );

  limparMapa();

  const marcador =
    L.marker([
      minhaLocalizacao.lat,
      minhaLocalizacao.lon
    ])
    .addTo(mapa)
    .bindPopup("📍 Sua localização");

  marcadores.push(marcador);
}

/* ROTAS */
async function calcularRotas() {

  if (!minhaLocalizacao ||
      !destinoSelecionado) {

    document.getElementById("mensagem").innerText =
      "Ative o GPS e escolha um destino.";

    return;
  }

  const rotasDiv =
    document.getElementById("rotas");

  rotasDiv.innerHTML =
    "<div class='card'>" +
    "<strong>🛣️ Calculando melhores rotas...</strong>" +
    "</div>";

  criarMapa();
  limparMapa();

  try {

    const origem =
      minhaLocalizacao.lon +
      "," +
      minhaLocalizacao.lat;

    const destino =
      destinoSelecionado.lon +
      "," +
      destinoSelecionado.lat;

    const url =
      "https://router.project-osrm.org/route/v1/driving/" +
      origem +
      ";" +
      destino +
      "?alternatives=true" +
      "&overview=full" +
      "&geometries=geojson";

    const resposta =
      await fetch(url);

    if (!resposta.ok) {
      throw new Error("Erro no roteamento");
    }

    const dados =
      await resposta.json();

    if (
      dados.code !== "Ok" ||
      !dados.routes ||
      dados.routes.length === 0
    ) {
      throw new Error("Nenhuma rota encontrada");
    }

    desenharRotas(dados.routes);

  } catch (erro) {

    rotasDiv.innerHTML =
      "<div class='mensagem'>" +
      "❌ Não foi possível calcular a rota agora." +
      "</div>";
  }
}

/* DESENHAR ROTAS */
function desenharRotas(rotas) {

  limparMapa();

  const rotasDiv =
    document.getElementById("rotas");

  rotasDiv.innerHTML = "";

  const bounds = [];

  rotas.forEach((rota, indice) => {

    const coordenadas =
      rota.geometry.coordinates.map(coord => [
        coord[1],
        coord[0]
      ]);

    const linha =
      L.polyline(
        coordenadas,
        {
          weight: indice === 0 ? 6 : 4,
          opacity: indice === 0 ? 0.9 : 0.55
        }
      ).addTo(mapa);

    linhasRota.push(linha);

    coordenadas.forEach(c =>
      bounds.push(c)
    );

    const distanciaKm =
      rota.distance / 1000;

    const minutos =
      Math.round(rota.duration / 60);

    const melhor =
      indice === 0;

    const div =
      document.createElement("div");

    div.className =
      melhor
        ? "rota melhor"
        : "rota";

    div.innerHTML = `
      <strong>
        ${melhor
          ? "🟢 Melhor opção"
          : "🔵 Rota alternativa"}
      </strong>

      <p>
        ${distanciaKm.toFixed(1)} km
        •
        ${minutos} min
      </p>

      ${
        melhor
          ? "<div class='melhor-texto'>" +
            "Mais rápida entre as opções encontradas." +
            "</div>"
          : "<div class='
