<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Copiloto de Rotas</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b1220;
      color: white;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 16px;
    }

    h1 {
      margin: 0 0 5px;
      font-size: 34px;
    }

    .status {
      color: #4ade80;
      font-size: 18px;
      margin-bottom: 18px;
    }

    input,
    button {
      width: 100%;
      border-radius: 14px;
      padding: 16px;
      font-size: 18px;
      margin-top: 10px;
    }

    input {
      background: #182337;
      color: white;
      border: 2px solid #334155;
    }

    button {
      border: none;
      background: #2563eb;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.99);
    }

    .card {
      background: #162236;
      border-radius: 18px;
      padding: 18px;
      margin-top: 16px;
    }

    .resultado {
      background: #111c2e;
      border-radius: 16px;
      padding: 16px;
      margin-top: 12px;
    }

    .resultado strong {
      display: block;
      font-size: 18px;
      margin-bottom: 8px;
    }

    .distancia {
      color: #aab7ca;
      margin-bottom: 8px;
    }

    #map {
      height: 430px;
      margin-top: 16px;
      border-radius: 18px;
      overflow: hidden;
      display: none;
    }

    .rota {
      background: #111c2e;
      border-radius: 16px;
      padding: 18px;
      margin-top: 12px;
      border: 1px solid #24344d;
    }

    .rota.melhor {
      border: 2px solid #4ade80;
    }

    .melhor-texto {
      color: #4ade80;
      font-weight: bold;
      margin-top: 12px;
    }

    .alternativa {
      color: #60a5fa;
      font-weight: bold;
    }

    .mensagem {
      background: #162236;
      border-radius: 16px;
      padding: 18px;
      margin-top: 16px;
      color: #cbd5e1;
    }

    .escondido {
      display: none;
    }

    .pequeno {
      color: #94a3b8;
      font-size: 14px;
      margin-top: 8px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🛵 Copiloto de Rotas</h1>

  <div class="status" id="status">
    ● GPS aguardando
  </div>

  <input
    id="destino"
    type="text"
    placeholder="Digite seu destino"
    autocomplete="off"
  >

  <button onclick="pesquisarDestino()">
    📍 Procurar destino
  </button>

  <button onclick="ativarGPS()">
    📍 Ativar localização
  </button>

  <div id="resultados" class="card escondido"></div>

  <div id="map"></div>

  <div id="rotas"></div>

  <div id="mensagem" class="mensagem">
    Digite um destino para começar.
  </div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

let minhaLocalizacao = null;
let destinoSelecionado = null;
let mapa = null;
let marcadores = [];
let linhasRota = [];

/*
  LIMITES APROXIMADOS DO ESTADO DO AMAPÁ
*/
const AMAPA = {
  sul: -1.5,
  oeste: -55.0,
  norte: 4.8,
  leste: -49.5
};

/*
  ATIVAR GPS
*/
function ativarGPS() {

  const status = document.getElementById("status");

  if (!navigator.geolocation) {
    status.innerText = "● GPS não disponível";
    return;
  }

  status.innerText = "● Localizando...";

  navigator.geolocation.getCurrentPosition(

    function(posicao) {

      minhaLocalizacao = {
        lat: posicao.coords.latitude,
        lon: posicao.coords.longitude
      };

      status.innerText = "● GPS ativo";

      document.getElementById("mensagem").innerText =
        "Localização encontrada. Agora escolha um destino.";

      mostrarMapaInicial();

    },

    function() {

      status.innerText =
        "● Permissão de localização negada";

    },

    {
      enableHighAccuracy: true,
      timeout: 15000,
      maximumAge: 30000
    }
  );
}

/*
  PESQUISAR DESTINO
*/
async function pesquisarDestino() {

  const campo = document.getElementById("destino");
  const texto = campo.value.trim();

  const resultados = document.getElementById("resultados");
  const mensagem = document.getElementById("mensagem");

  if (!texto) {
    mensagem.innerText = "Digite um destino para pesquisar.";
    return;
  }

  resultados.classList.remove("escondido");

  resultados.innerHTML =
    "<strong>🔎 Procurando no Amapá...</strong>";

  try {

    const url =
      "https://nominatim.openstreetmap.org/search" +
      "?format=json" +
      "&addressdetails=1" +
      "&limit=10" +
      "&countrycodes=br" +
      "&bounded=1" +
      "&viewbox=" +
      AMAPA.oeste + "," +
      AMAPA.norte + "," +
      AMAPA.leste + "," +
      AMAPA.sul +
      "&q=" +
      encodeURIComponent(texto);

    const resposta = await fetch(url, {
      headers: {
        "Accept": "application/json"
      }
    });

    if (!resposta.ok) {
      throw new Error("Erro na pesquisa");
    }

    const dados = await resposta.json();

    /*
      FILTRA NOVAMENTE PARA GARANTIR QUE
      O RESULTADO SEJA DO AMAPÁ
    */
    const filtrados = dados.filter(item => {

      const estado =
        (item.address?.state || "").toLowerCase();

      const display =
        (item.display_name || "").toLowerCase();

      return (
        estado.includes("amapá") ||
        estado.includes("amapa") ||
        display.includes("amapá") ||
        display.includes("amapa")
      );

    });

    if (filtrados.length === 0) {

      resultados.innerHTML =
        "<strong>❌ Nenhum destino encontrado no Amapá.</strong>" +
        "<div class='pequeno'>Tente colocar o nome da rua, bairro ou estabelecimento.</div>";

      return;
    }

    resultados.innerHTML =
      "<strong>📍 Destinos encontrados no Amapá</strong>" +
      "<div class='pequeno'>Escolha o local correto:</div>";

    filtrados.forEach((item, indice) => {

      const div = document.createElement("div");

      div.className = "resultado";

      const nome =
        item.display_name || "Destino";

      let distanciaTexto = "";

      if (minhaLocalizacao) {

        const distancia =
          calcularDistancia(
            minhaLocalizacao.lat,
            minhaLocalizacao.lon,
            parseFloat(item.lat),
            parseFloat(item.lon)
          );

        distanciaTexto =
          formatarDistancia(distancia) +
          " da sua localização";

      }

      div.innerHTML = `
        <strong>${indice + 1}. ${escaparHTML(nome)}</strong>
        <div class="distancia">${distanciaTexto}</div>
        <button>
          Usar este destino
        </button>
      `;

      div.querySelector("button").onclick = function() {

        selecionarDestino(item);

      };

      resultados.appendChild(div);

    });

  } catch (erro) {

    resultados.innerHTML =
      "<strong>❌ Não foi possível pesquisar agora.</strong>" +
      "<div class='pequeno'>Verifique sua internet e tente novamente.</div>";

  }
}

/*
  SELECIONAR DESTINO
*/
function selecionarDestino(item) {

  destinoSelecionado = {
    lat: parseFloat(item.lat),
    lon: parseFloat(item.lon),
    nome: item.display_name
  };

  document.getElementById("destino").value =
    item.display_name;

  document.getElementById("resultados").classList.add("escondido");

  if (!minhaLocalizacao) {

    document.getElementById("mensagem").innerText =
      "Destino selecionado. Ative sua localização para calcular a rota.";

    ativarGPS();

    return;
  }

  calcularRotas();

}

/*
  MOSTRAR MAPA
*/
function mostrarMapaInicial() {

  if (!minhaLocalizacao) return;

  criarMapa();

  mapa.setView(
    [
      minhaLocalizacao.lat,
      minhaLocalizacao.lon
    ],
    13
  );

  limparMapa();

  const marcador = L.marker([
    minhaLocalizacao.lat,
    minhaLocalizacao.lon
  ])
  .addTo(mapa)
  .bindPopup("📍 Sua localização");

  marcadores.push(marcador);

}

/*
  CRIAR MAPA
*/
function criarMapa() {

  const elemento = document.getElementById("map");

  elemento.style.display = "block";

  if (mapa) return;

  mapa = L.map("map");

  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      maxZoom: 19,
      attribution:
        '&copy; OpenStreetMap contributors'
    }
  ).addTo(mapa);

}

/*
  CALCULAR ROTAS
*/
async function calcularRotas() {

  if (!minhaLocalizacao || !destinoSelecionado) {

    document.getElementById("mensagem").innerText =
      "Ative o GPS e escolha um destino.";

    return;
  }

  const rotasDiv =
    document.getElementById("rotas");

  rotasDiv.innerHTML =
    "<div class='card'><strong>🛣️ Calculando melhores rotas...</strong></div>";

  criarMapa();

  limparMapa();

  try {

    const origem =
      minhaLocalizacao.lon +
      "," +
      minhaLocalizacao.lat;

    const destino =
      destinoSelecionado.lon +
      "," +
      destinoSelecionado.lat;

    const url =
      "https://router.project-osrm.org/route/v1/driving/" +
      origem +
      ";" +
      destino +
      "?alternatives=true" +
      "&overview=full" +
      "&geometries=geojson";

    const resposta = await fetch(url);

    if (!resposta.ok) {
      throw new Error("Erro no roteamento");
    }

    const dados = await resposta.json();

    if (
      dados.code !== "Ok" ||
      !dados.routes ||
      dados.routes.length === 0
    ) {

      throw new Error("Nenhuma rota encontrada");

    }

    desenharRotas(dados.routes);

  } catch (erro) {

    rotasDiv.innerHTML =
      "<div class='mensagem'>" +
      "❌ Não foi possível calcular a rota agora." +
      "</div>";

  }

}

/*
  DESENHAR ROTAS
*/
function desenharRotas(rotas) {

  limparMapa();

  const rotasDiv =
    document.getElementById("rotas");

  rotasDiv.innerHTML = "";

  const bounds = [];

  rotas.forEach((rota, indice) => {

    const coordenadas =
      rota.geometry.coordinates.map(coord => [
        coord[1],
        coord[0]
      ]);

    const linha = L.polyline(
      coordenadas,
      {
        weight: indice === 0 ? 6 : 4,
        opacity: indice === 0 ? 0.9 : 0.55
      }
    ).addTo(mapa);

    linhasRota.push(linha);

    coordenadas.forEach(c => bounds.push(c));

    const distanciaKm =
      rota.distance / 1000;

    const minutos =
      Math.round(rota.duration / 60);

    const melhor =
      indice === 0;

    const div =
      document.createElement("div");

    div.className =
      melhor
        ? "rota melhor"
        : "rota";

    div.innerHTML = `
      <strong>
        ${melhor ? "🟢 Melhor opção" : "🔵 Rota alternativa"}
      </strong>

      <p>
        ${formatarDistanciaKm(distanciaKm)}
        •
        ${minutos} min
      </p>

      ${
        melhor
          ? "<div class='melhor-texto'>Mais rápida entre as opções encontradas.</div>"
          : "<div class='alternativa'>Outra opção de trajeto.</div>"
      }

      <button>
        🗺️ Navegar pelo Google Maps
      </button>
    `;

    div.querySelector("button").onclick =
      function() {

        abrirGoogleMaps();

      };

    rotasDiv.appendChild(div);

  });

  if (bounds.length > 0) {

    mapa.fitBounds(bounds, {
      padding: [20, 20]
    });

  }

  const marcadorOrigem =
    L.marker([
      minhaLocalizacao.lat,
      minhaLocalizacao.lon
    ])
    .addTo(mapa)
    .bindPopup("📍 Sua localização");

  marcadores.push(marcadorOrigem);

  const marcadorDestino =
    L.marker([
      destinoSelecionado.lat,
      destinoSelecionado.lon
    ])
    .addTo(mapa)
    .bindPopup(
      "📍 " +
      destinoSelecionado.nome
    );

  marcadores.push(marcadorDestino);

  document.getElementById("mensagem").innerText =
    "Rota calculada. Escolha a opção que deseja usar.";

}

/*
  ABRIR GOOGLE MAPS
*/
function abrirGoogleMaps() {

  if (!minhaLocalizacao || !destinoSelecionado) {
    return;
  }

  const url =
    "https://www.google.com/maps/dir/?api=1" +
    "&origin=" +
    minhaLocalizacao.lat +
    "," +
    minhaLocalizacao.lon +
    "&destination=" +
    destinoSelecionado.lat +
    "," +
    destinoSelecionado.lon +
    "&travelmode=driving";

  window.open(url, "_blank");

}

/*
  LIMPAR MAPA
*/
function limparMapa() {

  marcadores.forEach(m => {

    if (mapa) {
      mapa.removeLayer(m);
    }

  });

  linhasRota.forEach(l => {

    if (mapa) {
      mapa.removeLayer(l);
    }

  });

  marcadores = [];
  linhasRota = [];

}

/*
  DISTÂNCIA
*/
function calcularDistancia(
  lat1,
  lon1,
  lat2,
  lon2
) {

  const R = 6371;

  const dLat =
    grausParaRad(lat2 - lat1);

  const dLon =
    grausParaRad(lon2 - lon1);

  const a =
    Math.sin(dLat / 2) *
    Math.sin(dLat / 2) +
    Math.cos(grausParaRad(lat1)) *
    Math.cos(grausParaRad(lat2)) *
    Math.sin(dLon / 2) *
    Math.sin(dLon / 2);

  const c =
    2 *
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1 - a)
    );

  return R * c;

}

function grausParaRad(valor) {
  return valor * Math.PI / 180;
}

function formatarDistancia(distancia) {

  if (distancia < 1) {
    return Math.round(distancia * 1000) + " m";
  }

  return distancia.toFixed(1) + " km";

}

function formatarDistanciaKm(distancia) {

  return distancia.toFixed(1) + " km";

}

/*
  EVITAR HTML INJETADO NO RESULTADO
*/
function escaparHTML(texto) {

  return texto
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}

/*
  TENTAR GPS AUTOMATICAMENTE
*/
ativarGPS();

</script>

</body>
</html>
