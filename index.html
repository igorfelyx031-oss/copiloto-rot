<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Copiloto de Rotas</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#0b1220;
color:#fff
}

.container{
max-width:700px;
margin:auto;
padding:7px
}

h1{
font-size:22px;
margin:3px 0
}

.status{
font-size:13px;
color:#4ade80;
margin-bottom:6px
}

.config{
background:#162236;
border-radius:10px;
padding:8px;
margin-bottom:6px
}

.config summary{
font-weight:bold;
font-size:14px;
cursor:pointer
}

.config input{
width:47%;
padding:8px;
margin:6px 1%;
background:#182337;
color:#fff;
border:1px solid #334155;
border-radius:8px
}

.config button,
.gps,
.recalcular{
width:100%;
padding:9px;
border:0;
border-radius:8px;
color:#fff;
font-weight:bold
}

.config button{
background:#334155
}

.search{
display:flex;
gap:5px
}

.search input{
flex:1;
min-width:0;
padding:11px;
font-size:16px;
background:#182337;
color:#fff;
border:1px solid #334155;
border-radius:9px
}

.search button{
width:105px;
padding:9px;
border:0;
border-radius:9px;
background:#2563eb;
color:#fff;
font-weight:bold
}

.gps{
margin-top:5px;
background:#334155
}

.recalcular{
margin-top:5px;
background:#16a34a;
display:none
}

.auto{
background:#162236;
padding:7px;
border-radius:9px;
margin-top:5px;
font-size:12px;
display:none
}

.card,
.resultado,
.rota{
background:#111c2e;
border-radius:11px;
padding:10px;
margin-top:6px
}

.resultado button,
.rota button{
width:100%;
padding:9px;
margin-top:6px;
border:0;
border-radius:8px;
background:#2563eb;
color:#fff;
font-weight:bold
}

.rota.melhor{
border:2px solid #4ade80
}

.custo{
font-size:18px;
font-weight:bold;
margin-top:4px
}

.verde{
color:#4ade80;
font-weight:bold
}

.pequeno{
color:#94a3b8;
font-size:11px;
margin-top:3px
}

.escondido{
display:none
}

.mensagem{
font-size:12px;
color:#cbd5e1;
padding:5px
}

#map{
height:60vh;
min-height:300px;
margin-top:6px;
border-radius:11px;
overflow:hidden;
display:none
}
</style>
</head>

<body>

<div class="container">

<h1>🛵 Copiloto de Rotas</h1>

<div id="status" class="status">
● GPS aguardando
</div>

<details class="config">

<summary>⚙️ Configurações</summary>

<div class="pequeno">
Preço da gasolina e consumo da moto
</div>

<input
id="precoGasolina"
type="number"
step="0.01"
value="6.45"
placeholder="R$/L"
>

<input
id="consumo"
type="number"
step="0.1"
value="30"
placeholder="km/L"
>

<button onclick="salvarConfiguracao()">
Salvar
</button>

</details>

<div class="search">

<input
id="destino"
type="text"
placeholder="Digite o destino"
autocomplete="off"
>

<button onclick="pesquisarDestino()">
Pesquisar
</button>

</div>

<button class="gps" onclick="ativarGPS()">
📍 Atualizar GPS
</button>

<button
id="botaoRecalcular"
class="recalcular"
onclick="recalcularRota()"
>
⚡ Recalcular rota
</button>

<div
id="autoStatus"
class="auto"
>
🔄 Atualização automática ativa
</div>

<div
id="resultados"
class="card escondido">
</div>

<div id="map"></div>

<div id="rotas"></div>

<div id="mensagem" class="mensagem">
Digite um destino para começar.
</div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

let minhaLocalizacao=null;
let destinoSelecionado=null;
let mapa=null;
let marcadores=[];
let linhasRota=[];

let gpsWatcher=null;

let recalculoEmAndamento=false;

let ultimoRecalculo=0;

let localDoUltimoRecalculo=null;

const INTERVALO_MINIMO=20000;

const DISTANCIA_MINIMA=150;


/* CONFIGURAÇÃO */

function carregarConfiguracao(){

const p=localStorage.getItem("precoGasolina");
const c=localStorage.getItem("consumoMoto");

if(p)
document.getElementById("precoGasolina").value=p;

if(c)
document.getElementById("consumo").value=c;

}


function salvarConfiguracao(){

const p=parseFloat(
document.getElementById("precoGasolina").value
);

const c=parseFloat(
document.getElementById("consumo").value
);

if(!p || p<=0 || !c || c<=0){

document.getElementById("mensagem").innerText=
"Informe valores válidos.";

return;

}

localStorage.setItem("precoGasolina",p);
localStorage.setItem("consumoMoto",c);

document.getElementById("mensagem").innerText=
"Configuração salva.";

}


/* GPS */

function iniciarGPSContinuo(){

if(!navigator.geolocation)
return;

if(gpsWatcher!==null)
return;

gpsWatcher=navigator.geolocation.watchPosition(

function(pos){

const nova={
lat:pos.coords.latitude,
lon:pos.coords.longitude
};

const anterior=minhaLocalizacao;

minhaLocalizacao=nova;

document.getElementById("status").innerText=
"● GPS ativo";


criarMapa();

if(!destinoSelecionado){

mapa.setView(
[nova.lat,nova.lon],
13
);

}


if(
destinoSelecionado &&
anterior
){

verificarRecalculoAutomatico(
anterior,
nova
);

}

},

function(){

document.getElementById("status").innerText=
"● Erro no GPS";

},

{

enableHighAccuracy:true,
timeout:15000,
maximumAge:5000

}

);

}


function ativarGPS(){

document.getElementById("status").innerText=
"● Localizando...";

iniciarGPSContinuo();

}


/* RECÁLCULO AUTOMÁTICO */

function verificarRecalculoAutomatico(
anterior,
atual
){

if(
recalculoEmAndamento ||
!destinoSelecionado
)
return;


const agora=Date.now();

if(
agora-ultimoRecalculo<
INTERVALO_MINIMO
)
return;


if(!localDoUltimoRecalculo){

localDoUltimoRecalculo={
lat:atual.lat,
lon:atual.lon
};

return;

}


const distanciaPercorrida=
calcularDistancia(

localDoUltimoRecalculo.lat,
localDoUltimoRecalculo.lon,

atual.lat,
atual.lon

);


if(
distanciaPercorrida<DISTANCIA_MINIMA
)
return;


recalcularAutomatico();

}


async function recalcularAutomatico(){

if(
recalculoEmAndamento ||
!destinoSelecionado ||
!minhaLocalizacao
)
return;


recalculoEmAndamento=true;

ultimoRecalculo=Date.now();

localDoUltimoRecalculo={
lat:minhaLocalizacao.lat,
lon:minhaLocalizacao.lon
};


document.getElementById("autoStatus").style.display=
"block";

document.getElementById("mensagem").innerText=
"🔄 Atualizando rota...";


try{

await calcularRotas();

}
finally{

recalculoEmAndamento=false;

}

}


/* RECÁLCULO MANUAL */

function recalcularRota(){

if(!destinoSelecionado){

document.getElementById("mensagem").innerText=
"Escolha um destino primeiro.";

return;

}

if(recalculoEmAndamento)
return;

document.getElementById("mensagem").innerText=
"📍 Atualizando localização...";

navigator.geolocation.getCurrentPosition(

function(pos){

minhaLocalizacao={
lat:pos.coords.latitude,
lon:pos.coords.longitude
};

ultimoRecalculo=0;

localDoUltimoRecalculo={
lat:minhaLocalizacao.lat,
lon:minhaLocalizacao.lon
};

calcularRotas();

},

function(){

document.getElementById("mensagem").innerText=
"❌ Não foi possível atualizar o GPS.";

},

{
enableHighAccuracy:true,
timeout:15000,
maximumAge:0
}

);

}


/* MAPA */

function criarMapa(){

const elemento=document.getElementById("map");

elemento.style.display="block";

if(mapa)
return;

mapa=L.map("map");

L.tileLayer(
"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
{
maxZoom:19,
attribution:"© OpenStreetMap"
}
).addTo(mapa);

}


/* PESQUISA */

async function pesquisarDestino(){

const texto=
document.getElementById("destino").value.trim();

const resultados=
document.getElementById("resultados");

if(!texto){

document.getElementById("mensagem").innerText=
"Digite um destino.";

return;

}

resultados.classList.remove("escondido");

resultados.innerHTML=
"<b>🔎 Procurando no Amapá...</b>";

try{

const consultas=[

texto,
texto+", Amapá",
texto+", Santana, Amapá",
texto+", Macapá, Amapá"

];

let encontrados=[];

for(
const consulta of consultas
){

const url=

"https://nominatim.openstreetmap.org/search"+
"?format=json"+
"&addressdetails=1"+
"&limit=10"+
"&countrycodes=br"+
"&bounded=1"+
"&viewbox=-55,4.8,-49.5,-1.5"+
"&q="+
encodeURIComponent(consulta);

const resposta=
await fetch(
url,
{
headers:{
"Accept":"application/json"
}
}
);

if(!resposta.ok)
continue;

const dados=
await resposta.json();

encontrados.push(...dados);

if(dados.length>0)
break;

}


const filtrados=
encontrados.filter(
item=>{

const estado=
(
item.address?.state||
""
).toLowerCase();

const nome=
(
item.display_name||
""
).toLowerCase();

return(
estado.includes("amap")||
nome.includes("amap")
);

}
);


const unicos=[];

filtrados.forEach(
item=>{

if(
!unicos.some(
x=>
x.lat===item.lat&&
x.lon===item.lon
)
){

unicos.push(item);

}

}
);


if(unicos.length===0){

resultados.innerHTML=
"<b>❌ Nenhum local encontrado no Amapá.</b>";

return;

}


resultados.innerHTML=
"<b>📍 Destinos no Amapá</b>"+
"<div class='pequeno'>Escolha o correto:</div>";


unicos.slice(0,6).forEach(
(item,index)=>{

const div=
document.createElement("div");

div.className="resultado";

let d="";

if(minhaLocalizacao){

d=
formatarDistancia(
calcularDistancia(
minhaLocalizacao.lat,
minhaLocalizacao.lon,
+item.lat,
+item.lon
)
);

}

div.innerHTML=

"<b>"+
(index+1)+
". "+
escaparHTML(
item.display_name
)+
"</b>"+

"<div class='pequeno'>"+
d+
"</div>"+

"<button>Usar este destino</button>";

div.querySelector("button").onclick=
function(){

selecionarDestino(item);

};

resultados.appendChild(div);

}
);

}
catch(e){

resultados.innerHTML=
"<b>❌ Erro na pesquisa.</b>";

}

}


/* DESTINO */

function selecionarDestino(item){

destinoSelecionado={

lat:+item.lat,
lon:+item.lon,
nome:item.display_name

};

document.getElementById("destino").value=
item.display_name;

document.getElementById("resultados")
.classList.add("escondido");

document.getElementById("botaoRecalcular")
.style.display="block";

document.getElementById("autoStatus")
.style.display="block";


if(!minhaLocalizacao){

ativarGPS();

setTimeout(
function(){

if(minhaLocalizacao)
calcularRotas();

},
1200
);

return;

}

localDoUltimoRecalculo={
lat:minhaLocalizacao.lat,
lon:minhaLocalizacao.lon
};

calcularRotas();

}


/* ROTAS */

async function calcularRotas(){

if(
!minhaLocalizacao ||
!destinoSelecionado
)
return;


if(recalculoEmAndamento &&
Date.now()-ultimoRecalculo<1000)
return;


recalculoEmAndamento=true;

ultimoRecalculo=Date.now();


const preco=
parseFloat(
document.getElementById("precoGasolina").value
);

const consumo=
parseFloat(
document.getElementById("consumo").value
);


document.getElementById("rotas").innerHTML=
"<div class='card'><b>🛣️ Calculando...</b></div>";


criarMapa();

limparMapa();


try{

const origem=
minhaLocalizacao.lon+
","+
minhaLocalizacao.lat;

const destino=
destinoSelecionado.lon+
","+
destinoSelecionado.lat;


const url=

"https://router.project-osrm.org/route/v1/driving/"+
origem+
";"+
destino+
"?alternatives=true"+
"&overview=full"+
"&geometries=geojson";


const resposta=
await fetch(
url
);

if(!resposta.ok)
throw new Error();

const dados=
await resposta.json();

if(
dados.code!=="Ok"||
!dados.routes||
!dados.routes.length
)
throw new Error();


mostrarRotas(
dados.routes,
preco,
consumo
);


localDoUltimoRecalculo={
lat:minhaLocalizacao.lat,
lon:minhaLocalizacao.lon
};


}
catch(e){

document.getElementById("rotas").innerHTML=
"<div class='card'>"+
"❌ Não foi possível calcular a rota."+
"</div>";

}
finally{

recalculoEmAndamento=false;

}

}


/* MOSTRAR ROTAS */

function mostrarRotas(
rotas,
preco,
consumo
){

limparMapa();

const divRotas=
document.getElementById("rotas");

divRotas.innerHTML="";

let menorCusto=Infinity;

rotas.forEach(
rota=>{

const km=
rota.distance/1000;

const custo=
(km/consumo)*preco;

if(custo<menorCusto)
menorCusto=custo;

}
);


const bounds=[];


rotas.forEach(
(rota,index)=>{

const pontos=
rota.geometry.coordinates.map(
p=>[
p[1],
p[0]
]
);


const linha=
L.polyline(
pontos,
{
weight:index===0?6:4,
opacity:index===0?.9:.5
}
).addTo(mapa);


linhasRota.push(linha);


pontos.forEach(
p=>bounds.push(p)
);


const km=
rota.distance/1000;

const minutos=
Math.round(
rota.duration/60
);

const litros=
km/consumo;

const custo=
litros*preco;

const economica=
Math.abs(
custo-menorCusto
)<0.01;


const div=
document.createElement("div");

div.className=
index===0
?"rota melhor"
:"rota";


div.innerHTML=

"<b>"+
(
index===0
?"🟢 Melhor rota"
:"🔵 Alternativa"
)+
"</b>"+

"<div>"+
km.toFixed(1)+
" km • "+
minutos+
" min"+
"</div>"+

"<div class='custo'>"+
"⛽ R$ "+
custo.toFixed(2)+
"</div>"+

"<div class='pequeno'>"+
litros.toFixed(2)+
" L de combustível"+
"</div>"+

(
economica
?"<div class='verde'>💰 Mais econômica</div>"
:""
)+

"<button>🗺️ Navegar</button>";


div.querySelector("button").onclick=
abrirGoogleMaps;


divRotas.appendChild(div);

}
);


if(bounds.length){

mapa.fitBounds(
bounds,
{
padding:[10,10]
}
);

}


marcadores.push(

L.marker(
[
minhaLocalizacao.lat,
minhaLocalizacao.lon
]
)
.addTo(mapa)
.bindPopup(
"📍 Sua localização atual"
),

L.marker(
[
destinoSelecionado.lat,
destinoSelecionado.lon
]
)
.addTo(mapa)
.bindPopup(
"📍 Destino"
)

);


document.getElementById("mensagem").innerText=
"Rota atualizada automaticamente.";

}


/* GOOGLE MAPS */

function abrirGoogleMaps(){

if(
!minhaLocalizacao||
!destinoSelecionado
)
return;


const url=

"https://www.google.com/maps/dir/?api=1"+
"&origin="+
minhaLocalizacao.lat+
","+
minhaLocalizacao.lon+
"&destination="+
destinoSelecionado.lat+
","+
destinoSelecionado.lon+
"&travelmode=driving";


window.open(
url,
"_blank"
);

}


/* LIMPAR MAPA */

function limparMapa(){

if(!mapa)
return;

marcadores.forEach(
m=>mapa.removeLayer(m)
);

linhasRota.forEach(
l=>mapa.removeLayer(l)
);

marcadores=[];
linhasRota=[];

}


/* DISTÂNCIA */

function calcularDistancia(
lat1,
lon1,
lat2,
lon2
){

const R=6371;

const dLat=
(lat2-lat1)*
Math.PI/180;

const dLon=
(lon2-lon1)*
Math.PI/180;

const a=

Math.sin(dLat/2)**2+

Math.cos(
lat1*Math.PI/180
)*

Math.cos(
lat2*Math.PI/180
)*

Math.sin(dLon/2)**2;


return 2*R*Math.asin(
Math.sqrt(a)
);

}


function formatarDistancia(d){

if(d<1)
return Math.round(d*1000)+" m";

return d.toFixed(1)+" km";

}


function escaparHTML(texto){

return texto
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* INICIAR */

carregarConfiguracao();

ativarGPS();

</script>

</body>
</html>
