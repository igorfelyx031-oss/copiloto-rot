<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Copiloto de Rotas</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0b1220;
    color: white;
}

.container {
    max-width: 700px;
    margin: auto;
    padding: 16px;
}

h1 {
    margin-bottom: 5px;
}

.status {
    color: #4ade80;
    margin-bottom: 15px;
}

input, button {
    width: 100%;
    padding: 15px;
    margin-top: 10px;
    border-radius: 12px;
    border: none;
    box-sizing: border-box;
    font-size: 16px;
}

input {
    background: #182337;
    color: white;
}

button {
    background: #2563eb;
    color: white;
    font-weight: bold;
}

button:disabled {
    opacity: .5;
}

#map {
    height: 330px;
    margin-top: 15px;
    border-radius: 20px;
    overflow: hidden;
}

.card {
    background: #182337;
    padding: 15px;
    border-radius: 15px;
    margin-top: 12px;
}

.rota {
    background: #111a2b;
    padding: 12px;
    border-radius: 12px;
    margin-top: 10px;
}

.rota.melhor {
    border: 2px solid #4ade80;
}

.verde {
    color: #4ade80;
    font-weight: bold;
}

.pequeno {
    color: #94a3b8;
    font-size: 14px;
}
</style>
</head>

<body>

<div class="container">

<h1>🛵 Copiloto de Rotas</h1>

<div class="status" id="status">
● GPS aguardando
</div>

<input
id="destino"
placeholder="Digite seu destino">

<button onclick="calcularRotas()">
📍 Calcular melhores rotas
</button>

<div id="map"></div>

<div class="card" id="resultado">
Digite um destino para começar.
</div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>

<script>

let latitude = null;
let longitude = null;
let destino = null;
let rotas = [];

let map = L.map("map").setView(
    [-14.235, -51.925],
    4
);

L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        maxZoom: 19,
        attribution: "© OpenStreetMap"
    }
).addTo(map);


async function pegarLocalizacao() {

    return new Promise((resolve, reject) => {

        if (!navigator.geolocation) {
            reject("GPS não disponível");
            return;
        }

        document.getElementById("status").innerText =
            "● Obtendo localização...";

        navigator.geolocation.getCurrentPosition(

            function(posicao) {

                latitude =
                    posicao.coords.latitude;

                longitude =
                    posicao.coords.longitude;

                document.getElementById("status").innerText =
                    "● GPS ativo";

                resolve();

            },

            function() {

                reject(
                    "Não foi possível acessar sua localização."
                );

            },

            {
                enableHighAccuracy: true,
                timeout: 15000,
                maximumAge: 0
            }
        );
    });
}


async function procurarDestino(nome) {

    const url =
        "https://nominatim.openstreetmap.org/search" +
        "?format=json" +
        "&limit=1" +
        "&countrycodes=br" +
        "&q=" +
        encodeURIComponent(nome);

    const resposta =
        await fetch(url);

    const dados =
        await resposta.json();

    if (!dados.length) {
        throw new Error(
            "Destino não encontrado."
        );
    }

    return {

        lat: Number(dados[0].lat),

        lon: Number(dados[0].lon),

        nome: dados[0].display_name

    };
}


async function calcularRotas() {

    const nomeDestino =
        document
        .getElementById("destino")
        .value
        .trim();

    const resultado =
        document.getElementById("resultado");

    if (!nomeDestino) {

        resultado.innerText =
            "Digite um destino primeiro.";

        return;
    }

    try {

        resultado.innerText =
            "Obtendo sua localização...";

        await pegarLocalizacao();


        resultado.innerText =
            "Procurando destino...";

        destino =
            await procurarDestino(
                nomeDestino
            );


        resultado.innerText =
            "Calculando melhores rotas...";


        const coordenadas =
            longitude +
            "," +
            latitude +
            ";" +
            destino.lon +
            "," +
            destino.lat;


        const url =
            "https://router.project-osrm.org/route/v1/driving/" +
            coordenadas +
            "?alternatives=3" +
            "&overview=full" +
            "&geometries=geojson";


        const resposta =
            await fetch(url);


        const dados =
            await resposta.json();


        if (
            dados.code !== "Ok" ||
            !dados.routes.length
        ) {

            throw new Error(
                "Não encontrei uma rota."
            );

        }


        rotas =
            dados.routes;


        mostrarRotas();


    } catch (erro) {

        resultado.innerText =
            erro.message || erro;

    }
}


function mostrarRotas() {

    document
        .getElementById("resultado")
        .innerHTML = "";


    rotas.forEach(
        (rota, indice) => {

            const distancia =
                (
                    rota.distance / 1000
                )
                .toFixed(1)
                .replace(".", ",");


            const tempo =
                Math.round(
                    rota.duration / 60
                );


            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "rota " +
                (indice === 0
                    ? "melhor"
                    : "");


            div.innerHTML =

                "<strong>" +

                (
                    indice === 0
                    ? "🟢 Melhor opção"
                    : "🔵 Rota alternativa"
                ) +

                "</strong>" +

                "<p>" +

                distancia +
                " km • " +
                tempo +
                " min" +

                "</p>" +

                (
                    indice === 0
                    ? "<p class='verde'>Mais rápida entre as opções encontradas.</p>"
                    : ""
                ) +

                "<button onclick='abrirMaps()'>" +

                "🗺️ Navegar pelo Google Maps" +

                "</button>";


            document
                .getElementById("resultado")
                .appendChild(div);


            desenharRota(
                rota,
                indice
            );

        }
    );


    map.setView(
        [
            latitude,
            longitude
        ],
        14
    );
}


function desenharRota(
    rota,
    indice
) {

    const pontos =
        rota.geometry.coordinates.map(
            ponto => [
                ponto[1],
                ponto[0]
            ]
        );


    const linha =
        L.polyline(
            pontos,
            {
                color:
                    indice === 0
                    ? "#22c55e"
                    : "#3b82f6",

                weight:
                    indice === 0
                    ? 7
                    : 4,

                opacity:
                    indice === 0
                    ? 1
                    : .5
            }
        )
        .addTo(map);


    if (indice === 0) {

        map.fitBounds(
            linha.getBounds(),
            {
                padding: [
                    20,
                    20
                ]
            }
        );

    }
}


function abrirMaps() {

    if (
        latitude === null ||
        longitude === null ||
        !destino
    ) {

        return;

    }


    const url =
        "https://www.google.com/maps/dir/?api=1" +

        "&origin=" +

        encodeURIComponent(
            latitude +
            "," +
            longitude
        ) +

        "&destination=" +

        encodeURIComponent(
            destino.nome
        ) +

        "&travelmode=driving";


    window.location.href =
        url;
}

</script>

</body>
</html>
