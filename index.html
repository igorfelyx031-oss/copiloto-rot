<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Copiloto de Rotas</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#0b1220;
    color:white
}

.container{
    max-width:700px;
    margin:auto;
    padding:16px
}

h1{
    margin-bottom:5px
}

.status{
    color:#4ade80;
    margin-bottom:15px
}

input,button{
    width:100%;
    padding:15px;
    margin-top:10px;
    border-radius:12px;
    border:none;
    box-sizing:border-box;
    font-size:16px
}

input{
    background:#182337;
    color:white
}

button{
    background:#2563eb;
    color:white;
    font-weight:bold
}

#map{
    height:330px;
    margin-top:15px;
    border-radius:20px;
    overflow:hidden
}

.card{
    background:#182337;
    padding:15px;
    border-radius:15px;
    margin-top:12px
}

.opcao{
    background:#111a2b;
    padding:12px;
    border-radius:12px;
    margin-top:10px
}

.rota{
    background:#111a2b;
    padding:12px;
    border-radius:12px;
    margin-top:10px
}

.rota.melhor{
    border:2px solid #4ade80
}

.verde{
    color:#4ade80;
    font-weight:bold
}

.pequeno{
    color:#94a3b8;
    font-size:14px
}

.erro{
    color:#f87171
}
</style>
</head>

<body>

<div class="container">

<h1>🛵 Copiloto de Rotas</h1>

<div class="status" id="status">
● GPS aguardando
</div>

<input
id="destino"
placeholder="Digite o destino">

<button onclick="calcularRotas()">
📍 Procurar destino
</button>

<div id="opcoes"></div>

<div id="map"></div>

<div class="card" id="resultado">
Digite um destino para começar.
</div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

let latitude = null;
let longitude = null;
let destino = null;
let rotas = [];
let destinosEncontrados = [];
let linhas = [];

const map = L.map("map").setView(
    [-0.035, -51.070],
    10
);

L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        maxZoom:19,
        attribution:"© OpenStreetMap"
    }
).addTo(map);


function distanciaKm(
    lat1,
    lon1,
    lat2,
    lon2
){

    const R = 6371;
    const rad = Math.PI / 180;

    const dLat =
        (lat2 - lat1) * rad;

    const dLon =
        (lon2 - lon1) * rad;

    const a =
        Math.sin(dLat / 2) ** 2 +
        Math.cos(lat1 * rad) *
        Math.cos(lat2 * rad) *
        Math.sin(dLon / 2) ** 2;

    return 2 * R *
        Math.asin(
            Math.sqrt(a)
        );
}


function pegarLocalizacao(){

    return new Promise(
        (resolve,reject)=>{

            if(!navigator.geolocation){

                reject(
                    "GPS não disponível."
                );

                return;
            }

            document
            .getElementById("status")
            .innerText =
                "● Obtendo localização...";

            navigator.geolocation.getCurrentPosition(

                function(pos){

                    latitude =
                        pos.coords.latitude;

                    longitude =
                        pos.coords.longitude;

                    document
                    .getElementById("status")
                    .innerText =
                        "● GPS ativo";

                    map.setView(
                        [
                            latitude,
                            longitude
                        ],
                        12
                    );

                    resolve();

                },

                function(){

                    reject(
                        "Não foi possível acessar sua localização."
                    );

                },

                {
                    enableHighAccuracy:true,
                    timeout:15000,
                    maximumAge:0
                }
            );
        }
    );
}


async function procurarDestinos(nome){

    const parametros =
        new URLSearchParams({

            format:"json",

            limit:"20",

            countrycodes:"br",

            addressdetails:"1",

            q:nome + ", Amapá, Brasil"

        });


    const url =
        "https://nominatim.openstreetmap.org/search?"
        + parametros.toString();


    const resposta =
        await fetch(url);


    if(!resposta.ok){

        throw new Error(
            "Erro ao procurar destinos."
        );
    }


    const dados =
        await resposta.json();


    /*
     * FILTRO FORTE:
     * Só aceita resultados cujo estado
     * seja realmente Amapá.
     */

    const somenteAmapa =
        dados.filter(function(item){

            const endereco =
                item.address || {};

            const estado =
                (
                    endereco.state ||
                    ""
                ).toLowerCase();

            const pais =
                (
                    endereco.country_code ||
                    ""
                ).toLowerCase();


            return (
                pais === "br" &&
                (
                    estado === "amapá" ||
                    estado === "amapa"
                )
            );

        });


    if(!somenteAmapa.length){

        throw new Error(
            "Nenhum destino encontrado no Amapá."
        );
    }


    return somenteAmapa

    .map(function(item){

        return {

            lat:Number(item.lat),

            lon:Number(item.lon),

            nome:item.display_name

        };

    })

    .filter(function(item){

        return Number.isFinite(item.lat)
        &&
        Number.isFinite(item.lon);

    })

    .sort(function(a,b){

        return distanciaKm(
            latitude,
            longitude,
            a.lat,
            a.lon
        )
        -
        distanciaKm(
            latitude,
            longitude,
            b.lat,
            b.lon
        );

    });

}


function mostrarOpcoes(){

    const caixa =
        document.getElementById(
            "opcoes"
        );


    caixa.innerHTML =
        '<div class="card">' +
        '<strong>📍 Destinos no Amapá</strong>' +
        '<div class="pequeno">' +
        'Escolha o local correto:' +
        '</div>' +
        '</div>';


    destinosEncontrados
    .slice(0,5)
    .forEach(
        function(destinoItem,index){

            const distancia =
                distanciaKm(
                    latitude,
                    longitude,
                    destinoItem.lat,
                    destinoItem.lon
                )
                .toFixed(1)
                .replace(".",",");


            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "opcao";


            div.innerHTML =

                "<strong>" +
                (index + 1) +
                ". " +
                destinoItem.nome +
                "</strong>" +

                "<div class='pequeno'>" +
                distancia +
                " km da sua localização" +
                "</div>" +

                "<button onclick='usarDestino(" +
                index +
                ")'>" +
                "Usar este destino" +
                "</button>";


            caixa.appendChild(div);

        }
    );
}


async function calcularRotas(){

    const nome =
        document
        .getElementById("destino")
        .value
        .trim();


    const resultado =
        document.getElementById(
            "resultado"
        );


    document.getElementById(
        "opcoes"
    ).innerHTML = "";


    if(!nome){

        resultado.innerText =
            "Digite um destino primeiro.";

        return;
    }


    try{

        resultado.innerText =
            "Obtendo localização...";


        await pegarLocalizacao();


        resultado.innerText =
            "Procurando somente no Amapá...";


        destinosEncontrados =
            await procurarDestinos(
                nome
            );


        if(
            destinosEncontrados.length === 1
        ){

            usarDestino(0);

            return;
        }


        mostrarOpcoes();


        resultado.innerText =
            "Escolha o destino correto acima.";

    }
    catch(erro){

        resultado.innerHTML =
            "<span class='erro'>" +
            (
                erro.message ||
                erro
            ) +
            "</span>";

    }
}


async function usarDestino(index){

    destino =
        destinosEncontrados[index];


    document.getElementById(
        "opcoes"
    ).innerHTML = "";


    const resultado =
        document.getElementById(
            "resultado"
        );


    resultado.innerText =
        "Calculando melhores rotas...";


    try{

        const coordenadas =
            longitude +
            "," +
            latitude +
            ";" +
            destino.lon +
            "," +
            destino.lat;


        const url =
            "https://router.project-osrm.org/route/v1/driving/" +
            coordenadas +
            "?alternatives=3" +
            "&overview=full" +
            "&geometries=geojson";


        const resposta =
            await fetch(url);


        const dados =
            await resposta.json();


        if(
            dados.code !== "Ok" ||
            !dados.routes ||
            !dados.routes.length
        ){

            throw new Error(
                "Não encontrei uma rota."
            );
        }


        rotas =
            dados.routes;


        mostrarRotas();

    }
    catch(erro){

        resultado.innerHTML =
            "<span class='erro'>" +
            (
                erro.message ||
                erro
            ) +
            "</span>";

    }
}


function limparLinhas(){

    linhas.forEach(
        function(linha){

            map.removeLayer(
                linha
            );

        }
    );

    linhas = [];
}


function mostrarRotas(){

    limparLinhas();


    const resultado =
        document.getElementById(
            "resultado"
        );


    resultado.innerHTML =
        "<div class='pequeno'>" +
        "Destino selecionado:" +
        "</div>" +

        "<strong>" +
        destino.nome +
        "</strong>";


    rotas.forEach(
        function(rota,index){

            const distancia =
                (
                    rota.distance /
                    1000
                )
                .toFixed(1)
                .replace(".",",");


            const tempo =
                Math.round(
                    rota.duration /
                    60
                );


            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "rota " +
                (
                    index === 0
                    ? "melhor"
                    : ""
                );


            div.innerHTML =

                "<strong>" +

                (
                    index === 0
                    ? "🟢 Melhor opção"
                    : "🔵 Rota alternativa"
                ) +

                "</strong>" +

                "<p>" +

                distancia +
                " km • " +
                tempo +
                " min" +

                "</p>" +

                (
                    index === 0
                    ? "<p class='verde'>" +
                      "Mais rápida entre as opções." +
                      "</p>"
                    : ""
                ) +

                "<button onclick='abrirMaps()'>" +
                "🗺️ Navegar pelo Google Maps" +
                "</button>";


            resultado.appendChild(
                div
            );


            desenharRota(
                rota,
                index
            );

        }
    );
}

    index
){

        rota.geometry.coordinates
