<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Copiloto de Rotas</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0b1220;
    color: white;
}

.container {
    max-width: 600px;
    margin: auto;
    padding: 16px;
}

h1 {
    margin-bottom: 5px;
}

.status {
    color: #4ade80;
    margin-bottom: 15px;
}

input, button {
    width: 100%;
    padding: 15px;
    margin-top: 10px;
    border-radius: 12px;
    border: none;
    box-sizing: border-box;
    font-size: 16px;
}

input {
    background: #182337;
    color: white;
}

button {
    background: #2563eb;
    color: white;
    font-weight: bold;
}

button:disabled {
    opacity: 0.5;
}

.mapa {
    height: 260px;
    margin-top: 15px;
    border-radius: 20px;
    background: #172235;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
}

.mapa span {
    font-size: 18px;
    color: #94a3b8;
    padding: 20px;
}

.card {
    background: #182337;
    padding: 15px;
    border-radius: 15px;
    margin-top: 12px;
}

.verde {
    color: #4ade80;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="container">

<h1>🛵 Copiloto de Rotas</h1>

<div class="status" id="status">
● GPS aguardando
</div>

<input id="destino" placeholder="Digite seu destino">

<button onclick="localizar()">
📍 Ativar localização
</button>

<div class="mapa">
<span id="mapaTexto">
Ative a localização e informe um destino para abrir a rota real.
</span>
</div>

<div class="card">

<strong>Rota</strong>

<p id="rotaInfo">
Aguardando localização e destino.
</p>

<button id="abrirRota" onclick="abrirGoogleMaps()" disabled>
🗺️ Abrir rota no Google Maps
</button>

</div>

<div class="card" id="mensagem">
As rotas agora usam sua localização atual e o destino informado.
</div>

</div>

<script>

let latitudeAtual = null;
let longitudeAtual = null;
let destinoAtual = "";

function localizar() {

    const status = document.getElementById("status");
    const mensagem = document.getElementById("mensagem");

    const destino =
        document.getElementById("destino").value.trim();

    if (!destino) {

        status.innerText = "● Informe o destino";

        mensagem.innerText =
            "Digite o endereço ou local para onde você quer ir.";

        document.getElementById("destino").focus();

        return;
    }

    if (!navigator.geolocation) {

        status.innerText =
            "● GPS não disponível";

        return;
    }

    destinoAtual = destino;

    status.innerText =
        "● Localizando...";

    mensagem.innerText =
        "Obtendo sua localização atual...";

    navigator.geolocation.getCurrentPosition(

        function(posicao) {

            latitudeAtual =
                posicao.coords.latitude;

            longitudeAtual =
                posicao.coords.longitude;

            status.innerText =
                "● GPS ativo";

            document.getElementById("mapaTexto").innerText =
                "📍 Localização encontrada. Destino: "
                + destinoAtual;

            document.getElementById("rotaInfo").innerText =
                "Origem: sua localização atual • Destino: "
                + destinoAtual;

            document.getElementById("abrirRota").disabled =
                false;

            mensagem.innerText =
                "Localização recebida. Toque em 'Abrir rota no Google Maps' para navegar pela rota real.";
        },

        function(erro) {

            if (erro.code === 1) {

                status.innerText =
                    "● Permissão de localização negada";

                mensagem.innerText =
                    "Permita o acesso à localização do navegador e tente novamente.";

            } else {

                status.innerText =
                    "● Não foi possível localizar";

                mensagem.innerText =
                    "Verifique se o GPS do celular está ligado e tente novamente.";
            }
        },

        {
            enableHighAccuracy: true,
            timeout: 10000,
            maximumAge: 0
        }
    );
}

function abrirGoogleMaps() {

    if (
        latitudeAtual === null ||
        longitudeAtual === null ||
        !destinoAtual
    ) {
        return;
    }

    const url =
        "https://www.google.com/maps/dir/?api=1"
        + "&origin="
        + encodeURIComponent(
            latitudeAtual + "," + longitudeAtual
        )
        + "&destination="
        + encodeURIComponent(destinoAtual)
        + "&travelmode=driving";

    window.location.href = url;
}

</script>

</body>
</html>
