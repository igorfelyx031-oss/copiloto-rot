<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Copiloto de Rotas</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#0b1220;
color:#fff;
}

.container{
max-width:700px;
margin:auto;
padding:7px;
}

h1{
font-size:23px;
margin:3px 0;
}

.status{
font-size:13px;
color:#4ade80;
margin-bottom:6px;
}

.config{
background:#162236;
border-radius:10px;
padding:8px;
margin-bottom:6px;
}

.config summary{
font-weight:bold;
font-size:14px;
cursor:pointer;
}

.config input{
width:47%;
padding:8px;
margin:6px 1%;
background:#182337;
color:#fff;
border:1px solid #334155;
border-radius:8px;
}

.config button{
width:100%;
padding:8px;
border:0;
border-radius:8px;
background:#334155;
color:#fff;
}

.search{
display:flex;
gap:5px;
}

.search input{
flex:1;
min-width:0;
padding:11px;
font-size:16px;
background:#182337;
color:#fff;
border:1px solid #334155;
border-radius:9px;
}

.search button{
width:105px;
padding:9px;
border:0;
border-radius:9px;
background:#2563eb;
color:#fff;
font-weight:bold;
}

.gps{
width:100%;
padding:8px;
margin-top:5px;
border:0;
border-radius:8px;
background:#334155;
color:#fff;
}

.card,
.resultado,
.rota{
background:#111c2e;
border-radius:11px;
padding:10px;
margin-top:6px;
}

.resultado button,
.rota button{
width:100%;
padding:9px;
margin-top:6px;
border:0;
border-radius:8px;
background:#2563eb;
color:#fff;
font-weight:bold;
}

.rota.melhor{
border:2px solid #4ade80;
}

.custo{
font-size:18px;
font-weight:bold;
margin-top:4px;
}

.verde{
color:#4ade80;
font-weight:bold;
}

.pequeno{
color:#94a3b8;
font-size:11px;
margin-top:3px;
}

.escondido{
display:none;
}

.mensagem{
font-size:12px;
color:#cbd5e1;
padding:5px;
}

#map{
height:58vh;
min-height:300px;
margin-top:6px;
border-radius:11px;
overflow:hidden;
display:none;
}

@media(max-width:430px){

h1{
font-size:21px;
}

#map{
height:60vh;
}

.search button{
width:100px;
}

}
</style>
</head>

<body>

<div class="container">

<h1>🛵 Copiloto de Rotas</h1>

<div id="status" class="status">
● GPS aguardando
</div>

<details class="config">

<summary>⚙️ Configurações</summary>

<div class="pequeno">
Preço da gasolina e consumo da moto
</div>

<input
id="precoGasolina"
type="number"
step="0.01"
value="6.45"
placeholder="R$/L"
>

<input
id="consumo"
type="number"
step="0.1"
value="30"
placeholder="km/L"
>

<button onclick="salvarConfiguracao()">
Salvar
</button>

</details>

<div class="search">

<input
id="destino"
type="text"
placeholder="Digite o destino"
autocomplete="off"
>

<button onclick="pesquisarDestino()">
Pesquisar
</button>

</div>

<button class="gps" onclick="ativarGPS()">
📍 Atualizar GPS
</button>

<div
id="resultados"
class="card escondido">
</div>

<div id="map"></div>

<div id="rotas"></div>

<div id="mensagem" class="mensagem">
Digite um destino para começar.
</div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

let minhaLocalizacao=null;
let destinoSelecionado=null;
let mapa=null;
let marcadores=[];
let linhasRota=[];


/* CONFIGURAÇÃO */

function carregarConfiguracao(){

const p=localStorage.getItem(
"precoGasolina"
);

const c=localStorage.getItem(
"consumoMoto"
);

if(p){
document.getElementById(
"precoGasolina"
).value=p;
}

if(c){
document.getElementById(
"consumo"
).value=c;
}

}


function salvarConfiguracao(){

const p=parseFloat(
document.getElementById(
"precoGasolina"
).value
);

const c=parseFloat(
document.getElementById(
"consumo"
).value
);

if(
p<=0 ||
c<=0 ||
!p ||
!c
){

document.getElementById(
"mensagem"
).innerText=
"Informe valores válidos.";

return;
}

localStorage.setItem(
"precoGasolina",
p
);

localStorage.setItem(
"consumoMoto",
c
);

document.getElementById(
"mensagem"
).innerText=
"Configuração salva.";

}


/* GPS */

function ativarGPS(){

if(!navigator.geolocation){

document.getElementById(
"status"
).innerText=
"● GPS indisponível";

return;

}

document.getElementById(
"status"
).innerText=
"● Localizando...";


navigator.geolocation.getCurrentPosition(

function(pos){

minhaLocalizacao={

lat:pos.coords.latitude,

lon:pos.coords.longitude

};

document.getElementById(
"status"
).innerText=
"● GPS ativo";

criarMapa();

mapa.setView(
[
minhaLocalizacao.lat,
minhaLocalizacao.lon
],
13
);

},

function(){

document.getElementById(
"status"
).innerText=
"● Não foi possível obter GPS";

},

{
enableHighAccuracy:true,
timeout:15000,
maximumAge:30000
}

);

}


/* MAPA */

function criarMapa(){

const elemento=
document.getElementById(
"map"
);

elemento.style.display=
"block";

if(mapa)
return;

mapa=L.map("map");

L.tileLayer(
"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
{
maxZoom:19,
attribution:"© OpenStreetMap"
}
).addTo(mapa);

}


/* PESQUISA */

async function pesquisarDestino(){

const texto=
document.getElementById(
"destino"
).value.trim();

const resultados=
document.getElementById(
"resultados"
);

if(!texto){

document.getElementById(
"mensagem"
).innerText=
"Digite um destino.";

return;

}

resultados.classList.remove(
"escondido"
);

resultados.innerHTML=
"<b>🔎 Procurando no Amapá...</b>";


try{

const consultas=[

texto,

texto+", Amapá",

texto+", Santana, Amapá",

texto+", Macapá, Amapá"

];

let encontrados=[];


for(
const consulta of consultas
){

const url=

"https://nominatim.openstreetmap.org/search"+
"?format=json"+
"&addressdetails=1"+
"&limit=10"+
"&countrycodes=br"+
"&bounded=1"+
"&viewbox=-55,4.8,-49.5,-1.5"+
"&q="+
encodeURIComponent(consulta);


const resposta=
await fetch(
url,
{
headers:{
"Accept":
"application/json"
}
}
);

if(!resposta.ok)
continue;

const dados=
await resposta.json();

encontrados.push(
...dados
);

if(dados.length>0)
break;

}


/* FILTRO AMAPÁ */

const filtrados=
encontrados.filter(
item=>{

const estado=
(
item.address?.state||
""
).toLowerCase();

const nome=
(
item.display_name||
""
).toLowerCase();

return(

estado.includes("amap")

||

nome.includes("amap")

);

}
);


/* REMOVER DUPLICADOS */

const unicos=[];

filtrados.forEach(
item=>{

const chave=
item.lat+
","+
item.lon;

if(
!unicos.some(
x=>
x.lat+
","+
x.lon===
chave
)
){

unicos.push(item);

}

}
);


if(unicos.length===0){

resultados.innerHTML=
"<b>❌ Nenhum local encontrado no Amapá.</b>"+
"<div class='pequeno'>"+
"Tente usar o nome da rua, bairro ou estabelecimento."+
"</div>";

return;

}


resultados.innerHTML=
"<b>📍 Destinos no Amapá</b>"+
"<div class='pequeno'>Escolha o correto:</div>";


unicos
.slice(0,6)
.forEach(
(item,index)=>{

const div=
document.createElement(
"div"
);

div.className=
"resultado";


let distanciaTexto="";


if(minhaLocalizacao){

const d=
calcularDistancia(

minhaLocalizacao.lat,
minhaLocalizacao.lon,

parseFloat(item.lat),
parseFloat(item.lon)

);

distanciaTexto=
formatarDistancia(d)+
" da sua localização";

}


div.innerHTML=

"<b>"+
(index+1)+
". "+
escaparHTML(
item.display_name
)+
"</b>"+

"<div class='pequeno'>"+
distanciaTexto+
"</div>"+

"<button>"+
"Usar este destino"+
"</button>";


div.querySelector(
"button"
).onclick=
function(){

selecionarDestino(
item
);

};


resultados.appendChild(
div
);

}
);


}

catch(erro){

resultados.innerHTML=
"<b>❌ Erro na pesquisa.</b>"+
"<div class='pequeno'>"+
"Verifique a internet e tente novamente."+
"</div>";

}

}


/* DESTINO */

function selecionarDestino(item){

destinoSelecionado={

lat:parseFloat(
item.lat
),

lon:parseFloat(
item.lon
),

nome:item.display_name

};

document.getElementById(
"destino"
).value=
item.display_name;

document.getElementById(
"resultados"
).classList.add(
"escondido"
);

if(!minhaLocalizacao){

document.getElementById(
"mensagem"
).innerText=
"Ativando GPS...";

ativarGPS();

setTimeout(
function(){

if(minhaLocalizacao)
calcularRotas();

},
1200
);

return;

}

calcularRotas();

}


/* ROTAS */

async function calcularRotas(){

if(
!minhaLocalizacao ||
!destinoSelecionado
)
return;


const preco=
parseFloat(
document.getElementById(
"precoGasolina"
).value
);

const consumo=
parseFloat(
document.getElementById(
"consumo"
).value
);


const rotasDiv=
document.getElementById(
"rotas"
);

rotasDiv.innerHTML=
"<div class='card'><b>🛣️ Calculando...</b></div>";


criarMapa();

limparMapa();


try{

const origem=
minhaLocalizacao.lon+
","+
minhaLocalizacao.lat;

const destino=
destinoSelecionado.lon+
","+
destinoSelecionado.lat;


const url=

"https://router.project-osrm.org/route/v1/driving/"+
origem+
";"+
destino+
"?alternatives=true"+
"&overview=full"+
"&geometries=geojson";


const resposta=
await fetch(url);

const dados=
await resposta.json();


if(
dados.code!=="Ok" ||
!dados.routes
)
throw new Error();


mostrarRotas(
dados.routes,
preco,
consumo
);


}

catch(e){

rotasDiv.innerHTML=
"<div class='card'>"+
"❌ Não foi possível calcular a rota."+
"</div>";

}

}


/* MOSTRAR ROTAS */

function mostrarRotas(
rotas,
preco,
consumo
){

limparMapa();

const divRotas=
document.getElementById(
"rotas"
);

divRotas.innerHTML="";


let menorCusto=Infinity;

rotas.forEach(
rota=>{

const km=
rota.distance/1000;

const custo=
(km/consumo)*preco;

if(custo<menorCusto)
menorCusto=custo;

});


const bounds=[];


rotas.forEach(
(rota,index)=>{

const pontos=
rota.geometry.coordinates.map(
p=>[
p[1],
p[0]
]
);


const linha=
L.polyline(
pontos,
{
weight:
index===0
?6
:4,

opacity:
index===0
?.9
:.5
}
).addTo(mapa);


linhasRota.push(
linha
);


pontos.forEach(
p=>bounds.push(p)
);


const km=
rota.distance/1000;

const minutos=
Math.round(
rota.duration/60
);

const litros=
km/consumo;

const custo=
litros*preco;


const economica=
Math.abs(
custo-menorCusto
)<0.01;


const div=
document.createElement(
"div"
);

div.className=
index===0
?"rota melhor"
:"rota";


div.innerHTML=

"<b>"+
(
index===0
?"🟢 Melhor rota"
:"🔵 Alternativa"
)+
"</b>"+

"<div>"+
km.toFixed(1)+
" km • "+
minutos+
" min"+
"</div>"+

"<div class='custo'>"+
"⛽ R$ "+
custo.toFixed(2)+
"</div>"+

"<div class='pequeno'>"+
litros.toFixed(2)+
" L de combustível"+
"</div>"+

(
economica
?"<div class='verde'>💰 Mais econômica</div>"
:""
)+

"<button>"+
"🗺️ Navegar"+
"</button>";


div.querySelector(
"button"
).onclick=
abrirGoogleMaps;


divRotas.appendChild(
div
);

}
);


if(bounds.length){

mapa.fitBounds(
bounds,
{
padding:[
10,
10
]
}
);

}


marcadores.push(

L.marker(
[
minhaLocalizacao.lat,
minhaLocalizacao.lon
]
)
.addTo(mapa)
.bindPopup(
"📍 Sua localização"
),

L.marker(
[
destinoSelecionado.lat,
destinoSelecionado.lon
]
)
.addTo(mapa)
.bindPopup(
"📍 Destino"
)

);


document.getElementById(
"mensagem"
).innerText=
"Rota pronta.";

}


/* GOOGLE MAPS */

function abrirGoogleMaps(){

if(
!minhaLocalizacao ||
!destinoSelecionado
)
return;


const url=

"https://www.google.com/maps/dir/?api=1"+
"&origin="+
minhaLocalizacao.lat+
","+
minhaLocalizacao.lon+
"&destination="+
destinoSelecionado.lat+
","+
destinoSelecionado.lon+
"&travelmode=driving";


window.open(
url,
"_blank"
);

}


/* LIMPAR */

function limparMapa(){

if(!mapa)
return;

marcadores.forEach(
m=>mapa.removeLayer(m)
);

linhasRota.forEach(
l=>mapa.removeLayer(l)
);

marcadores=[];
linhasRota=[];

}


/* DISTÂNCIA */

function calcularDistancia(
lat1,
lon1,
lat2,
lon2
){

const R=6371;

const dLat=
(lat2-lat1)*
Math.PI/180;

const dLon=
(lon2-lon1)*
Math.PI/180;

const a=

Math.sin(dLat/2)**2+

Math.cos(
lat1*Math.PI/180
)*

Math.cos(
lat2*Math.PI/180
)*

Math.sin(dLon/2)**2;


return 2*R*Math.asin(
Math.sqrt(a)
);

}


function formatarDistancia(
d
){

if(d<1){

return Math.round(
d*1000
)+" m";

}

return d.toFixed(1)+" km";

}


function escaparHTML(
texto
){

return texto
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* INICIAR */

carregarConfiguracao();

ativarGPS();

</script>

</body>
</html>
